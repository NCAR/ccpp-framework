name: Capgen Unit Tests

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit_tests:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        fortran-compiler: [gfortran-9, gfortran-10, gfortran-11, gfortran-12]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v3
    - name: update repos and install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libopenmpi-dev \
          ${{matrix.fortran-compiler}} \
          cmake \
          python3 \
          git \
          libxml2-utils
        which xmllint
        xmllint --version

    - name: Build the framework
      run: |
        cmake --fresh -S. -B./build -DOPENMP=ON -DCCPP_FRAMEWORK_ENABLE_TESTS=ON
        cd build
        make

    - name: Run unit tests
      run: |
        cd build
        ctest --rerun-failed --output-on-failure . --verbose

    - name: Run Fortran to metadata test
      run: cd test && ./test_fortran_to_metadata.sh

    - name: Run offline metadata parser test
      run: cd test && ./test_offline_metadata_checker.sh
