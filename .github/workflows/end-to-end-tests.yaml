name: capgen end-to-end tests

on:
  workflow_dispatch:
  pull_request:
    branches: [develop, feature/capgen-v1]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  end-to-end-tests:
    strategy:
      matrix:
        os: [ubuntu-22.04]
        fortran-compiler: [gfortran-9, gfortran-10, gfortran-11, gfortran-12]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Update repos and install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libopenmpi-dev \
          ${{matrix.fortran-compiler}} \
          cmake \
          python3 \
          git \
          libxml2-utils
        python -m pip install --upgrade pip
        pip install pytest
        which xmllint
        xmllint --version
        which pytest
    - name: Run end-to-end tests
      run: |
        cmake --fresh -S./end-to-end-tests -B./build
        cd build
        make
        ctest --rerun-failed --output-on-failure .

  # End to end tests with memory-error detection enabled
  end-to-end-tests-asan:
    needs: end-to-end-tests
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.12
      uses: actions/setup-python@v4
      with:
        python-version: 3.12
    - name: Update repos and install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          libopenmpi-dev \
          gfortran-12 \
          cmake \
          python3 \
          git \
          libxml2-utils
        python -m pip install --upgrade pip
        pip install pytest
    - name: Run end-to-end tests under AddressSanitizer
      env:
        # Check for memory errors (LeakSanitizer is a separate issue)
        ASAN_OPTIONS: "detect_leaks=0"
      run: |
        cmake --fresh -S./end-to-end-tests -B./build \
          -DCMAKE_Fortran_FLAGS="-fsanitize=address -fno-omit-frame-pointer" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"
        cd build
        make
        ctest --rerun-failed --output-on-failure .
